name: Setup mysystem
description: Installe Python, active le cache pip et installe les dépendances de mysystem

inputs:
  python-version:
    description: Version de Python
    default: '3.13'
  extra-packages:
    description: Paquets pip supplémentaires (ex. pylint, pytest)
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: script/mysystem/requirements.txt
    - name: Dépendances
      shell: bash                   # obligatoire dans une action composite
      env:
        EXTRA: ${{ inputs.extra-packages }}
      run: pip install -r script/mysystem/requirements.txt $EXTRA