name: mysystem

on:
  push:
    branches: ['feature/**']       # jamais sur un tag
    paths:
      - 'script/mysystem/**'
      - '.github/workflows/mysystem.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendances
        run: pip install ifaddr psutil pylint
      - name: Lint
        run: pylint --disable=missing-docstring script/mysystem/mysystem.py

  run:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dépendances
        run: pip install ifaddr psutil
      - name: Exécution
        run: python script/mysystem/mysystem.py