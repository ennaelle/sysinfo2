name: mysystem

on:
  push:
    branches: ['feature/**']       # jamais sur un tag


permissions:
  contents: read

env:
  SCRIPT_PY: script/mysystem/mysystem.py

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4             # obligatoire avant une action locale
      - uses: ./.github/actions/setup-mysystem
        with:
          extra-packages: pylint
      - name: Lint
        run: pylint --disable=missing-docstring "$SCRIPT_PY"

  run:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4             # obligatoire avant une action locale
      - uses: ./.github/actions/setup-mysystem
      - name: Exécution
        run: python "$SCRIPT_PY"

  unit:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write                           # pour publier le rapport de tests
    steps:
      - uses: actions/checkout@v4             # obligatoire avant une action locale
      - uses: ./.github/actions/setup-mysystem
        with:
          extra-packages: pytest
      - name: Tests unitaires
        run: pytest --junitxml=report.xml
      - name: Rapport de tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: report.xml
          detailed_summary: true     # tableau test par test dans le résumé du run
          include_passed: true       # lister aussi les tests réussis