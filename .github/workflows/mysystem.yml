name: mysystem

on:
  push:
    branches: ['feature/**']       # jamais sur un tag

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'                                          # active le cache pip
          cache-dependency-path: script/mysystem/requirements.txt
      - name: Dépendances
        run: pip install -r script/mysystem/requirements.txt pylint
      - name: Lint
        run: pylint --disable=missing-docstring script/mysystem/mysystem.py

  run:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'                                          # active le cache pip
          cache-dependency-path: script/mysystem/requirements.txt
      - name: Dépendances
        run: pip install -r script/mysystem/requirements.txt
      - name: Exécution
        run: python script/mysystem/mysystem.py