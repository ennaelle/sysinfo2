name: sysinfo

on:
  push:
    branches: ['feature/**']       # jamais sur un tag

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérification de syntaxe
        run: make lint

  build:
    needs: lint
    uses: ./.github/workflows/build-sysinfo.yml    # reusable workflow

  run:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du binaire
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: bin
      - name: Exécution
        run: |
          chmod +x bin/sysinfo
          ./bin/sysinfo