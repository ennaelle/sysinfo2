name: sysinfo

on:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérification de syntaxe
        run: make lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation
        run: |
          mkdir -p bin
          make build
      - name: Publication du binaire
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-${{ github.sha }}
          path: bin/sysinfo

  run:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du binaire
        uses: actions/download-artifact@v4
        with:
          name: sysinfo-${{ github.sha }}
          path: bin
      - name: Exécution
        run: |
          chmod +x bin/sysinfo      # les artefacts ne conservent pas les droits d'exécution
          ./bin/sysinfo